name: tm3l-break-detector

services:
  postgres:
    image: postgres:17-alpine
    container_name: break-detector-db
    environment:
      POSTGRES_USER: tm3l_user
      POSTGRES_PASSWORD: tm3l_password
      POSTGRES_DB: tm3l_break_detector
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tm3l_user -d tm3l_break_detector"]
      interval: 2s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: break-detector-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  engine:
    build:
      context: .
      dockerfile: deploy/Dockerfile.engine
    container_name: break-detector-engine
    ports:
      - "50051:50051"
    deploy:
      resources:
        limits:
          memory: 512M

  server:
    build:
      context: .
      dockerfile: deploy/Dockerfile.server
    container_name: break-detector-server
    environment:
      DATABASE_URL: "postgres://tm3l_user:tm3l_password@postgres:5432/tm3l_break_detector?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      ANALYZER_URL: "engine:50051"
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      engine:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 256M

  viewer:
    build:
      context: .
      dockerfile: deploy/Dockerfile.viewer
    container_name: break-detector-viewer
    ports:
      - "5173:5173"
    depends_on:
      - server
    volumes:
      - ./viewer:/app
      - /app/node_modules
    deploy:
      resources:
        limits:
          memory: 384M

volumes:
  postgres_data:
