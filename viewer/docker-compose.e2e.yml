services:
  viewer:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=development

  playwright:
    build:
      context: .
      dockerfile: Dockerfile.e2e
    depends_on:
      - viewer
    environment:
      - PLAYWRIGHT_TEST_BASE_URL=http://viewer:5173
    command: >
      sh -c "sleep 5 && npx playwright test"
