name: 'TM3L Break Detector'
description: 'Deterministic API Contract & Multi-Language Code Migration Governance in CI/CD Pull Requests'
author: 'tm3l'

inputs:
  mode:
    description: 'Execution mode: "openapi" (default) or "code_migration"'
    required: false
    default: 'openapi'
  language:
    description: 'Source code language for code_migration mode (python, go, typescript)'
    required: false
    default: 'python'
  base-spec:
    description: 'Path to the base (original) OpenAPI spec file (required in openapi mode)'
    required: false
  target:
    description: 'Path to the target OpenAPI spec or source code file'
    required: true
  target-spec:
    description: 'Alias for target (for backwards compatibility)'
    required: false

outputs:
  breaking-changes:
    description: 'Number of breaking changes detected'
  dangerous-changes:
    description: 'Number of dangerous changes detected'
  diff-report:
    description: 'Formatted diff report JSON payload'

runs:
  using: 'docker'
  image: 'Dockerfile'
  args:
    - '--mode'
    - ${{ inputs.mode }}
    - '--language'
    - ${{ inputs.language }}
    - '--target'
    - ${{ inputs.target || inputs.target-spec }}

branding:
  icon: 'shield'
  color: 'green'
