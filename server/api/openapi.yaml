openapi: 3.0.3
info:
  title: Break Detector API
  description: API for comparing OpenAPI specifications and detecting breaking changes.
  version: 0.1.0
paths:
  /api/v1/diff:
    post:
      summary: Compare two OpenAPI specifications
      description: Runs the diff engine on base and target specs to return categorized changes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - base_spec
                - target_spec
              properties:
                base_spec:
                  type: string
                  description: Base OpenAPI specification content (JSON or YAML)
                target_spec:
                  type: string
                  description: Target OpenAPI specification content (JSON or YAML)
      responses:
        '200':
          description: Diff report successfully generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiffReport'
        '400':
          description: Invalid input or unparseable specification

  /api/v1/health:
    get:
      summary: Health check endpoint
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

components:
  schemas:
    DiffReport:
      type: object
      properties:
        id:
          type: string
          format: uuid
        breaking_count:
          type: integer
        risky_count:
          type: integer
        safe_count:
          type: integer
        changes:
          type: array
          items:
            $ref: '#/components/schemas/ChangeItem'

    ChangeItem:
      type: object
      properties:
        classification:
          type: string
          enum: [breaking, risky, safe]
        path:
          type: string
        method:
          type: string
        message:
          type: string
